<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek 对话</title>
<style>
  /* 底色跟面板本身对齐，铺满之后不会露出其它颜色 */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #1c1d20; } }
</style>
</head>
<body>

<!--
  侧边栏里跑的就是网页上那个面板本身（同一份 config.js + panel.js），
  只是由 sidepanel.js 告诉它"你在浏览器自己的容器里"，于是它铺满整栏、藏掉几个没意义的按钮。
  这里不能用内联脚本 —— MV3 扩展页的 CSP 禁止，所以逻辑放在 sidepanel.js 里。
-->
<script src="config.js"></script>
<script src="panel.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
