<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="pop">

  <div class="top">
    <span class="name">字幕实时翻译</span>
    <label class="switch" title="总开关">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="knob"></span></span>
    </label>
  </div>

  <div class="key">
    <label for="apiKey">DeepSeek API Key</label>
    <div class="row">
      <input id="apiKey" type="password" spellcheck="false" autocomplete="off" placeholder="sk-...">
      <button type="button" id="saveKey">保存</button>
    </div>
    <p class="tip" id="keyTip"></p>
  </div>

  <div class="status">
    <div class="line"><span class="k">状态</span><span class="v" id="stState">—</span></div>
    <div class="line"><span class="k">字幕来源</span><span class="v" id="stSource">—</span></div>
    <div class="line" id="stScreenLine" hidden><span class="k">读屏</span><span class="v" id="stScreen">—</span></div>
    <div class="line"><span class="k">已翻译</span><span class="v" id="stProgress">—</span></div>
    <div class="line"><span class="k">最近往返</span><span class="v" id="stLatency">—</span></div>
    <div class="line err" id="stErrLine" hidden><span class="k">错误</span><span class="v" id="stErr"></span></div>
    <div class="line"><span class="k">页面</span><span class="v" id="stTitle"></span></div>
  </div>

  <div class="foot">
    <button type="button" class="link" id="openOpts">更多设置</button>
    <span class="src">deepseek-flash</span>
  </div>

</div>
<script src="shared/settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
